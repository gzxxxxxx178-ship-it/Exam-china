[project]
name = "exam-finding"
version = "0.3.0"
description = "个人使用的公职、事业单位与国企招聘信息聚合系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx[socks]>=0.28,<1",
    "pdfplumber>=0.11,<1",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6.0,<7",
    "selectolax>=0.3,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
    "xlrd>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
